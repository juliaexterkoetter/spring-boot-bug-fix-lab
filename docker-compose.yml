services:
  app:
    build:
      context: .
    image: spring-boot-bug-fix-lab:local
    ports:
      - "${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-q", "-Y", "off", "--spider", "http://127.0.0.1:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
